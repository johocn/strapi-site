# www.joho.cn Strapi-site 静态站点（Next.js 静态导出）OpenResty 配置
# 80 端口：证书验证 + 全部 HTTP 强制跳转 HTTPS
server {
    listen 80 ;
    listen [::]:80 ;
    server_name www.joho.cn;
    access_log /www/sites/www.joho.cn/log/access_80.log main;
    error_log /www/sites/www.joho.cn/log/error_80.log;
    # SSL 证书自动续期验证目录
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }
    # 所有 http 请求永久跳转 https
    location / {
        return 301 https://$host$request_uri;
    }
    root /www/sites/www.joho.cn/index;
}

# 443 HTTPS 主服务段
server {
    listen 443 ssl http2 ;
    listen [::]:443 ssl http2 ;
    server_name www.joho.cn;

    ssl_certificate /www/sites/www.joho.cn/ssl/www.joho.cn.pem;
    ssl_certificate_key /www/sites/www.joho.cn/ssl/www.joho.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    index index.php index.html index.htm default.php default.htm default.html;
    root /www/sites/www.joho.cn/index;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    access_log /www/sites/www.joho.cn/log/access_ssl.log main;
    error_log /www/sites/www.joho.cn/log/error_ssl.log;

    # SSL 证书自动续期验证目录
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    # 备选语言首页 /en/ 映射到静态文件 en.html
    location = /en/ {
        return 301 /en.html;
    }

    # Next.js 静态导出：xxx.html 文件；未命中走 error_page 404（返回真实 404 状态）
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Strapi API 接口反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:1337/api/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }

    # 上传文件静态资源代理
    location /uploads/ {
        proxy_pass http://127.0.0.1:1337/uploads/;
    }

    # SEO 输出端点（zhao-website content-api）
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:1337/api/zhao-website/v1/sitemap.xml;
    }
    location = /robots.txt {
        proxy_pass http://127.0.0.1:1337/api/zhao-website/v1/robots.txt;
    }
    location = /llms.txt {
        proxy_pass http://127.0.0.1:1337/api/zhao-website/v1/llms.txt;
    }

    error_page 404 /404.html;
}
